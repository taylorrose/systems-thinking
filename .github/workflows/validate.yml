name: Validate graph

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate structure and metadata
        run: python scripts/validate_graph.py --root . --corpus
      - name: Run independent audit checks
        run: python scripts/audit/audit_checks.py --root .
